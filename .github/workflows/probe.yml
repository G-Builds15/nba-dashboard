name: Probe stats sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe candidate NBA stats endpoints
        run: |
          probe() {
            echo "=== $1"
            rm -f /tmp/out.txt; : > /tmp/out.txt
            code=$(curl -s -L --max-time 12 -o /tmp/out.txt -w '%{http_code} %{size_download}B %{time_total}s' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36' \
              "$2") || true
            echo "status/size/time: $code"
            head -c 400 /tmp/out.txt || true; echo; echo
          }
          probe "stats.nba.com (current, expected to fail)" \
            "https://stats.nba.com/stats/leaguedashplayerstats?Season=2026-27&SeasonType=Regular+Season&PerMode=PerGame&MeasureType=Base&LastNGames=0&LeagueID=00&Month=0&OpponentTeamID=0&PORound=0&PaceAdjust=N&Period=0&PlusMinus=N&Rank=N&Outcome=&Location=&SeasonSegment=&DateFrom=&DateTo=&VsConference=&VsDivision=&GameSegment=&Conference=&Division=&DraftPick=&DraftYear=&GameScope=&PlayerExperience=&PlayerPosition=&StarterBench=&TeamID=0&College=&Country=&Height=&Weight="
          probe "ESPN byathlete (player season stats)" \
            "https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/statistics/byathlete?region=us&lang=en&contentorigin=espn&isqualified=false&page=1&limit=5&sort=offensive.avgPoints%3Adesc&season=2027&seasontype=2"
          probe "ESPN teams" \
            "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams"
          probe "ESPN scoreboard" \
            "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"
          probe "ESPN team stats (Celtics id 2)" \
            "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/2/statistics"
          probe "NBA CDN static (scoreboard)" \
            "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json"
          probe "balldontlie (401 = reachable, needs key)" \
            "https://api.balldontlie.io/v1/players?per_page=1"
